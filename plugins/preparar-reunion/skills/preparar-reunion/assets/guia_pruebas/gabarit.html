<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/*__ESTILOS__*/
</style>
</head>
<body>
<div class="feuille">
  <header class="couv">
    <div>
      <img src="__LOGO__" alt="__CLIENTE__">
      <div class="st" data-i="sur"></div>
      <h1 data-i="titre"></h1>
    </div>
    <div class="meta">
      <div class="langue" role="group" aria-label="Langue / Idioma"><button type="button" data-l="es">ES</button><button type="button" data-l="fr">FR</button></div>
      <div data-i="quoi"></div><div data-i="date"></div></div>
  </header>
  <section class="acces" id="acces"></section>
  <div class="prep" id="prep"></div>
  <main id="fiches"></main>
  <div class="fin" id="fin"><b data-i="finT"></b><span data-i="fin"></span></div>
  <footer data-i="pied"></footer>
</div>
<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true"><div class="z-haut"></div><button type="button" class="fermer" aria-label="×">×</button><button type="button" class="nav prec" aria-label="‹">‹</button><div class="z-img"></div><div class="z-txt"></div><button type="button" class="nav suiv" aria-label="›">›</button></div>
<script>
// Datos de la guía (los escribe construir_guia.py; la plantilla no contiene nada de ningún cliente).
const CFG = /*__CFG__*/null;
const DATA = CFG.contenido, CAPT = CFG.capt, ACCES = CFG.cuentas || [], KIT = CFG.kit_url || "";
const UI = {
  es: { comptes: "Cuentas de prueba", copie: "Copiado", cuenta: "Cuenta", pasos: "Pasos", paso: "Paso", fichier: "Fichero para la prueba", fichiers: "Ficheros para la prueba", abrir: "Abrir ↗" },
  fr: { comptes: "Comptes de test", copie: "Copié", cuenta: "Compte", pasos: "Étapes", paso: "Étape", fichier: "Fichier pour le test", fichiers: "Fichiers pour le test", abrir: "Ouvrir ↗" },
};
const T = { es: Object.assign({}, UI.es, CFG.textos.es), fr: Object.assign({}, UI.fr, CFG.textos.fr) };
let L = CFG.idioma || "es"; try { const l = localStorage.getItem("guide-langue"); if (l === "fr" || l === "es") L = l; } catch (er) {}
if (CFG.solo_idioma) L = CFG.solo_idioma;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])).replace(/« /g, "«&nbsp;").replace(/ »/g, "&nbsp;»");
const court = (s) => { const t = s.split(/[:.;]/)[0].trim(); return t.length > 46 ? t.slice(0, 44) + "…" : t; };
const tr = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v[L] : v) || "";
let FICHES = [];
const ETAT = {};
const cpt = (n) => ACCES.find((a) => a.n === n);
const kitHref = (f) => (/^(https?:)?\//.test(f) ? f : KIT + f);

function rendre() {
  FICHES = DATA[L].sections.flatMap((s) => s.fichas); const t = T[L];
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i]").forEach((e) => (e.textContent = t[e.dataset.i] || ""));
  document.querySelectorAll(".langue button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === L));
  const cp = (v) => `<button type="button" class="copie" data-copie="${esc(v)}">${esc(v)}</button>`;
  const pl = CFG.plataforma || {};
  $("#acces").hidden = !ACCES.length;
  $("#acces").innerHTML = ACCES.length ? `<h3>${t.comptes}</h3>
    <div class="carte plein"><div class="t"><b>${esc(tr(pl.nombre))}</b>${pl.url ? `<a href="${pl.url}" target="_blank" rel="noopener">${pl.url.replace(/^https?:\/\//, "")} ↗</a>` : ""}</div>
      ${ACCES.map((x) => `<div class="ligne-acces${x.ve ? "" : " simple"}"><span class="niv" style="--c:${x.c}">${esc(tr(x.nivel))}</span>${cp(x.u)}${cp(x.m)}${x.ve ? `<span class="voit">${esc(tr(x.ve))}</span>` : ""}</div>`).join("")}</div>` : "";
  const kit = DATA[L].kit || [];
  $("#prep").hidden = !t.prep && !kit.length;
  $("#prep").innerHTML = `${t.prep || ""}
    ${kit.length ? `<div class="kit">${kit.map(([f, k]) => `<a href="${kitHref(f)}" target="_blank" rel="noopener">${esc(k)} ↓</a>`).join("")}</div>` : ""}`;
  $("#fin").hidden = !t.fin;
  let n = 0;
  $("#fiches").innerHTML = DATA[L].sections.map((s) => `<section><h2 class="sec">${esc(s.t)}${s.s ? `<small>${esc(s.s)}</small>` : ""}</h2>${s.fichas.map((f) => fiche(f, ++n)).join("")}</section>`).join("");
  FICHES.forEach((f) => montrer(f.id, ETAT[f.id] || 0));
}
function fiche(f, num) {
  const a = cpt(f.cuenta), kit = f.kit || [];
  return `<article class="ficha" id="${f.id}"><div class="cab"><span class="num">${num}</span><h4>${esc(f.n)}</h4>
      ${a ? `<span class="chip" style="--c:${a.c}">${T[L].cuenta} ${esc(tr(a.nivel))}</span>` : ""}${f.disp ? `<span class="chip g">${esc(f.disp)}</span>` : ""}</div>
    <div class="col">
      <p class="nuevo">${esc(f.q)}</p>
      ${kit.length ? `<div><div class="lbl">${kit.length > 1 ? T[L].fichiers : T[L].fichier}</div><div class="kit">${kit.map(([x, k]) => `<a href="${kitHref(x)}" target="_blank" rel="noopener">↓ ${esc(k)}</a>`).join("")}</div></div>` : ""}
      ${f.url ? `<div class="enl"><a href="${f.url}" target="_blank" rel="noopener">${esc(T[L].abrir)}</a></div>` : ""}
      <div><div class="lbl">${T[L].pasos}</div><ol class="pasos">${f.p.map((s, k) => `<li data-p="${CAPT[s[1]] ? k : ""}">${esc(s[0])}</li>`).join("")}</ol></div>
    </div>
    <figure class="visu" style="margin:0"><div class="cadre-vue"></div>
      <div class="onglets">${f.p.length > 1 ? f.p.map((s, k) => (CAPT[s[1]] ? `<button type="button" data-p="${k}">${k + 1}</button>` : "")).join("") : ""}</div>
      <figcaption></figcaption></figure></article>`;
}
function montrer(id, p) {
  const el = document.getElementById(id), f = FICHES.find((x) => x.id === id); if (!el || !f) return;
  if (!CAPT[(f.p[p] || [])[1]]) { const k = f.p.findIndex((s) => CAPT[s[1]]); if (k < 0) return; p = k; }
  ETAT[id] = p;
  el.querySelectorAll(".onglets button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.p === String(p)));
  el.querySelectorAll(".pasos li").forEach((l) => l.classList.toggle("actif", l.dataset.p === String(p)));
  const s = CAPT[f.p[p][1]], txt = f.p[p][0];
  el.querySelector(".cadre-vue").innerHTML = `<a class="ecran${s.w < 600 ? " mobile" : ""}" href="p/${s.img}.webp"><img src="p/${s.img}.webp" alt="${esc(f.n)} · ${p + 1}" loading="lazy" style="aspect-ratio:${s.r}">
    ${s.b.map(([x, y, w, h], n) => `<div class="cadre${y < 9 ? " bas" : ""}${x > 62 ? " droite" : ""}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">${n === 0 ? `<span class="leyenda"><i>${p + 1}</i><span class="tx">${esc(court(txt))}</span></span>` : ""}</div>`).join("")}</a>`;
  el.querySelector("figcaption").innerHTML = `<b>${T[L].paso} ${p + 1}/${f.p.length}</b> · ${esc(txt)}`;
}
// Imagen ampliada dentro de la página. Las flechas se quedan en la misma ficha (regla de Adrián).
let Z = null;
const pasosConCaptura = (f) => f.p.map((s, k) => (CAPT[s[1]] ? k : -1)).filter((k) => k >= 0);
function afficherZoom(id, p) {
  const z = $("#zoom"), el = document.getElementById(id), f = FICHES.find((x) => x.id === id);
  Z = [id, p]; montrer(id, p);
  const c = el.querySelector(".cadre-vue .ecran").cloneNode(true); c.removeAttribute("href"); c.classList.remove("mobile"); c.querySelector("img").loading = "eager";
  z.querySelector(".z-img").replaceChildren(c);
  z.querySelector(".z-haut").innerHTML = `${esc(f.n)}<span>${T[L].paso} ${p + 1}/${f.p.length}</span>`;
  z.querySelector(".z-txt").innerHTML = esc(f.p[p][0]);
  const l = pasosConCaptura(f), k = l.indexOf(p);
  z.querySelector(".prec").disabled = k <= 0; z.querySelector(".suiv").disabled = k >= l.length - 1;
  z.querySelector(".prec").hidden = z.querySelector(".suiv").hidden = l.length < 2;
}
function bouger(d) { if (!Z) return; const f = FICHES.find((x) => x.id === Z[0]), l = pasosConCaptura(f), n = l[l.indexOf(Z[1]) + d]; if (n !== undefined) afficherZoom(Z[0], n); }
function fermer() { const z = $("#zoom"); z.hidden = true; z.querySelector(".z-img").innerHTML = ""; document.body.style.overflow = ""; Z = null; }
document.addEventListener("keydown", (e) => { if ($("#zoom").hidden) return; if (e.key === "Escape") fermer(); else if (e.key === "ArrowRight") { e.preventDefault(); bouger(1); } else if (e.key === "ArrowLeft") { e.preventDefault(); bouger(-1); } });
let xT = null;
$("#zoom").addEventListener("touchstart", (e) => { xT = e.touches[0].clientX; }, { passive: true });
$("#zoom").addEventListener("touchend", (e) => { if (xT === null) return; const dx = e.changedTouches[0].clientX - xT; xT = null; if (Math.abs(dx) > 50) bouger(dx < 0 ? 1 : -1); });
document.addEventListener("click", (e) => {
  const lg = e.target.closest(".langue button");
  if (lg) { L = lg.dataset.l; try { localStorage.setItem("guide-langue", L); } catch (er) {} rendre(); return; }
  const k = e.target.closest(".copie");
  if (k) { const v = k.dataset.copie, fin = () => { k.classList.add("ok"); k.textContent = T[L].copie; setTimeout(() => { k.classList.remove("ok"); k.textContent = v; }, 1100); };
    try { navigator.clipboard.writeText(v).then(fin, () => { const r = document.createRange(); r.selectNodeContents(k); getSelection().removeAllRanges(); getSelection().addRange(r); }); } catch (er) {} return; }
  if (e.target.closest("#zoom")) {
    if (e.target.closest(".prec")) bouger(-1); else if (e.target.closest(".suiv")) bouger(1);
    else if (e.target.closest(".fermer") || !e.target.closest(".ecran, .z-txt, .z-haut")) fermer();
    return;
  }
  const ec = e.target.closest(".cadre-vue .ecran");
  if (ec) { e.preventDefault(); const id = ec.closest(".ficha").id; afficherZoom(id, ETAT[id] || 0); $("#zoom").hidden = false; document.body.style.overflow = "hidden"; $("#zoom .fermer").focus(); return; }
  const o = e.target.closest(".onglets button, .pasos li");
  if (o && o.dataset.p !== "") montrer(o.closest(".ficha").id, +o.dataset.p);
});
if (CFG.solo_idioma) document.querySelector(".langue").hidden = true;
rendre();
</script>
</body>
</html>
